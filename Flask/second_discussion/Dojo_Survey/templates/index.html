<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dojo Survey</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container my-5" style="max-width: 600px">
      <div class="card p-4">
        <h2 class="mb-4 text-center">Dojo Survey</h2>
        <form action="/process" method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name:</label>
            <input
              type="text"
              name="name"
              id="name"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="location" class="form-label">Dojo Location:</label>
            <select name="location" id="location" class="form-select" required>
              <option value="" disabled selected>Select a location</option>
              <option value="Ramallah">Ramallah</option>
              <option value="Nablus">Nablus</option>
              <option value="Hebron">Hebron</option>
              <option value="Jenin">Jenin</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="language" class="form-label">Favorite Language:</label>
            <select name="language" id="language" class="form-select" required>
              <option value="" disabled selected>Select a language</option>
              <option value="Python">Python</option>
              <option value="JavaScript">JavaScript</option>
              <option value="C#">C#</option>
              <option value="Java">Java</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Experience Level:</label>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="experience"
                id="beginner"
                value="Beginner"
              />
              <label class="form-check-label" for="beginner">Beginner</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="experience"
                id="intermediate"
                value="Intermediate"
              />
              <label class="form-check-label" for="intermediate"
                >Intermediate</label
              >
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="experience"
                id="advanced"
                value="Advanced"
              />
              <label class="form-check-label" for="advanced">Advanced</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label d-block"
              >Skills (Select all that apply):</label
            >
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="skills"
                value="HTML/CSS"
                id="skill1"
              />
              <label class="form-check-label" for="skill1">HTML / CSS</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="skills"
                value="SQL"
                id="skill2"
              />
              <label class="form-check-label" for="skill2">SQL</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="skills"
                value="Git"
                id="skill3"
              />
              <label class="form-check-label" for="skill3"
                >Git / Version Control</label
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="comment" class="form-label">Comment (optional):</label>
            <textarea
              name="comment"
              id="comment"
              rows="3"
              class="form-control"
            ></textarea>
          </div>

          <div class="text-end">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
