<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <title>Power House Gym - Welcome</title>
  </head>
  <body>
    <h1>Welcome to Power House Gym</h1>

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li>{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}

    <div class="container">
      <form action="/register" method="POST">
        {% csrf_token %}
        <h2>Register</h2>
        <p><label>Username:</label> <input type="text" name="username" /></p>
        <p>
          <label>First Name:</label> <input type="text" name="first_name" />
        </p>
        <p><label>Last Name:</label> <input type="text" name="last_name" /></p>
        <p><label>Email:</label> <input type="email" name="email" /></p>
        <p>
          <label>Phone Number:</label> <input type="text" name="phone_number" />
        </p>
        <p>
          <label>Password:</label> <input type="password" name="password" />
        </p>
        <p>
          <label>Confirm Password:</label>
          <input type="password" name="confirm_pw" />
        </p>
        <button type="submit">Register</button>
      </form>

      <form action="/login" method="POST">
        {% csrf_token %}
        <h2>Login</h2>
        <p><label>Username:</label> <input type="text" name="username" /></p>
        <p>
          <label>Password:</label> <input type="password" name="password" />
        </p>
        <button type="submit">Log In</button>
      </form>
    </div>
  </body>
</html>
