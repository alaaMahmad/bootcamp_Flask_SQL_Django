<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add a New Show</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <div class="header-flex">
        <h1>Add a New Show</h1>
        <a href="/shows">Go Back</a>
      </div>

      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}

      <form action="/shows/create" method="POST">
        {% csrf_token %}
        <p>
          <label>Title</label>
          <input type="text" name="title" />
        </p>
        <div class="form-row">
          <p class="form-group-flex">
            <label>Network</label>
            <input type="text" name="network" />
          </p>
          <p class="form-group-flex">
            <label>Release Date</label>
            <input type="date" name="release_date" />
          </p>
        </div>
        <p>
          <label>Description</label>
          <textarea name="description"></textarea>
        </p>
        <button type="submit">Create</button>
      </form>
    </div>
  </body>
</html>
