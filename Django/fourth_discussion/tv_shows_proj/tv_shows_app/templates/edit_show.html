<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Show {{ show.id }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <div class="header-flex">
        <h1>Edit Show {{ show.id }}</h1>
        <a href="/shows">Go Back</a>
      </div>

      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}

      <form action="/shows/{{ show.id }}/update" method="POST">
        {% csrf_token %}
        <p>
          <label>Title</label>
          <input type="text" name="title" value="{{ show.title }}" />
        </p>
        <div class="form-row">
          <p class="form-group-flex">
            <label>Network</label>
            <input type="text" name="network" value="{{ show.network }}" />
          </p>
          <p class="form-group-flex">
            <label>Release Date</label>
            <input
              type="date"
              name="release_date"
              value="{{ show.release_date|date:'Y-m-d' }}"
            />
          </p>
        </div>
        <p>
          <label>Description</label>
          <textarea name="description">{{ show.description }}</textarea>
        </p>
        <button type="submit">Update</button>
      </form>
      <br />
      <a href="/shows/{{ show.id }}">Go to Show</a>
    </div>
  </body>
</html>
