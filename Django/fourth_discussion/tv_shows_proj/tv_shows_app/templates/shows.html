<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>All Shows</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container">
      <h1>All Shows</h1>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Network</th>
            <th>Release Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for show in shows %}
          <tr>
            <td>{{ show.id }}</td>
            <td>{{ show.title }}</td>
            <td>{{ show.network }}</td>
            <td>{{ show.release_date|date:"F d, Y" }}</td>
            <td>
              <a href="/shows/{{ show.id }}">Show</a> |
              <a href="/shows/{{ show.id }}/edit">Edit</a> |
              <form
                action="/shows/{{ show.id }}/destroy"
                method="POST"
                class="inline-form"
              >
                {% csrf_token %}
                <button
                  type="submit"
                  style="
                    background: none;
                    border: none;
                    color: #007bff;
                    padding: 0;
                    cursor: pointer;
                    text-decoration: underline;
                  "
                >
                  Delete
                </button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      <br />
      <a href="/shows/new">Add a New Show</a>
    </div>
  </body>
</html>
