<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ book.title }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="column" style="max-width: 600px">
      <h1>{{ book.title }}</h1>
      <p><strong>ID:</strong> {{ book.id }}</p>
      <p><strong>Description:</strong> {{ book.desc }}</p>

      <h3>Authors:</h3>
      <ul>
        {% for author in book.authors.all %}
        <li>{{ author.first_name }} {{ author.last_name }}</li>
        {% empty %}
        <li>No authors assigned yet.</li>
        {% endfor %}
      </ul>

      <form action="/books/{{ book.id }}/add_author" method="POST">
        {% csrf_token %}
        <select name="author_id">
          {% for author in unassigned_authors %}
          <option value="{{ author.id }}">
            {{ author.first_name }} {{ author.last_name }}
          </option>
          {% endfor %}
        </select>
        <br /><br />
        <button type="submit">Add</button>
      </form>

      <br /><a href="/">Back to Books</a>
    </div>
  </body>
</html>
