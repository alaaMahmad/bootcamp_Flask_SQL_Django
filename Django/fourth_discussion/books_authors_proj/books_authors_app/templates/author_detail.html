<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ author.first_name }} {{ author.last_name }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="column" style="max-width: 600px">
      <h1>{{ author.first_name }} {{ author.last_name }}</h1>
      <p><strong>ID:</strong> {{ author.id }}</p>
      <p><strong>Notes:</strong> {{ author.notes }}</p>

      <h3>Books:</h3>
      <ul>
        {% for book in author.books.all %}
        <li>{{ book.title }}</li>
        {% empty %}
        <li>No books assigned yet.</li>
        {% endfor %}
      </ul>

      <form action="/authors/{{ author.id }}/add_book" method="POST">
        {% csrf_token %}
        <select name="book_id">
          {% for book in unassigned_books %}
          <option value="{{ book.id }}">{{ book.title }}</option>
          {% endfor %}
        </select>
        <br /><br />
        <button type="submit">Add</button>
      </form>

      <br /><a href="/authors">Back to Authors</a>
    </div>
  </body>
</html>
