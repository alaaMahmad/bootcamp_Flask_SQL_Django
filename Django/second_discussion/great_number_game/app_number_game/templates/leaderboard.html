<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light text-center p-5">
    <div
      class="container bg-white p-5 rounded shadow-sm"
      style="max-width: 500px"
    >
      <h1 class="mb-4">Leaderboard</h1>

      {% if leaderboard %}
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Attempts</th>
          </tr>
        </thead>
        <tbody>
          {% for winner in leaderboard %}
          <tr>
            <td>{{ winner.name }}</td>
            <td>{{ winner.attempts }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="text-muted">No winners yet. Be the first!</p>
      {% endif %}

      <a href="/" class="btn btn-primary mt-3">Back to Game</a>
    </div>
  </body>
</html>
